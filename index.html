<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Portfolio - Mochamad Rizky Ramadhan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar untuk tampilan terminal */
        #terminal-body::-webkit-scrollbar {
            width: 6px;
        }
        #terminal-body::-webkit-scrollbar-track {
            background: #0f172a;
        }
        #terminal-body::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- ====== SECTION TERMINAL WIDGET ====== -->
    <section class="w-full max-w-3xl mx-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden">
            
            <!-- Header Terminal -->
            <div class="bg-slate-800/80 px-4 py-3 flex items-center justify-between border-b border-slate-700/50">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-red-500 rounded-full inline-block"></span>
                    <span class="w-3 h-3 bg-yellow-500 rounded-full inline-block"></span>
                    <span class="w-3 h-3 bg-green-500 rounded-full inline-block"></span>
                </div>
                <div class="text-xs text-slate-400 font-mono">visitor@rzr:~</div>
                <div class="w-12"></div> <!-- Spacer untuk menjaga title tetap center -->
            </div>

            <!-- Body Terminal -->
            <div id="terminal-body" class="p-4 md:p-6 h-80 md:h-96 overflow-y-auto font-mono text-xs md:text-sm space-y-3 leading-relaxed">
                <p class="text-blue-400">Welcome to RZR Developer Terminal!</p>
                <p class="text-slate-400">Type <span class="text-emerald-400">'help'</span> to see available commands.</p>
            </div>

            <!-- Input Bar -->
            <div class="bg-slate-900/90 border-t border-slate-800 px-4 py-3">
                <div class="flex items-center gap-2 font-mono text-xs md:text-sm">
                    <span class="text-emerald-400 font-bold">visitor@rzr:~$</span>
                    <input type="text" id="terminal-input" class="bg-transparent text-slate-100 focus:outline-none flex-1 font-mono text-xs md:text-sm" placeholder="Ketik perintah di sini..." autocomplete="off">
                </div>
            </div>

        </div>
    </section>

    <!-- ====== SCRIPT TERMINAL INTERAKTIF ====== -->
    <script>
        const terminalBody = document.getElementById('terminal-body');
        const terminalInput = document.getElementById('terminal-input');

        // Daftar Perintah & Respon
        const commands = {
            help: `Perintah yang tersedia:<br>
                   - <span class="text-blue-400">help</span>: Menampilkan daftar perintah<br>
                   - <span class="text-blue-400">about</span>: Informasi singkat tentang developer<br>
                   - <span class="text-blue-400">projects</span>: Daftar tautan proyek pilihan<br>
                   - <span class="text-blue-400">skills</span>: Daftar keahlian & pemrograman<br>
                   - <span class="text-blue-400">contact</span>: Kontak & media sosial<br>
                   - <span class="text-blue-400">clear</span>: Membersihkan layar terminal`,
            
            about: `Mochamad Rizky Ramadhan - Web Developer & Digital Solutions Specialist.<br>Fokus pada pengembangan aplikasi web fungsional, responsif, dan terintegrasi basis data modern.`,
            
            projects: `1. Sistem Absensi Digital -> <a href="https://absensi.rzr.my.id/" target="_blank" class="text-blue-400 underline hover:text-blue-300">absensi.rzr.my.id</a><br>
                       2. Web Portal RPL -> <a href="https://web-rpl.rzr.my.id/" target="_blank" class="text-blue-400 underline hover:text-blue-300">web-rpl.rzr.my.id</a><br>
                       3. Manajemen Tabungan -> <a href="https://tabungan.rzr.my.id/" target="_blank" class="text-blue-400 underline hover:text-blue-300">tabungan.rzr.my.id</a><br>
                       4. Jasa Pembuatan Website -> <a href="https://jasa-pembuatan-website.rzr.my.id/" target="_blank" class="text-blue-400 underline hover:text-blue-300">jasa-pembuatan-website.rzr.my.id</a><br>
                       5. Virtual Photobox Studio -> <a href="https://photobox.rzr.my.id/" target="_blank" class="text-blue-400 underline hover:text-blue-300">photobox.rzr.my.id</a>`,
            
            skills: `Tech Stack:<br>- Frontend: HTML, CSS, JavaScript, Tailwind CSS, Next.js<br>- Backend: PHP Native, Laravel, Express.js, Python<br>- Database & Cloud: Supabase, MySQL, Vercel, Cloudflare`,
            
            contact: `WhatsApp: +62 895-4010-61300<br>GitHub: <a href="https://github.com/rizkyganteng050908" target="_blank" class="text-blue-400 underline hover:text-blue-300">github.com/rizkyganteng050908</a>`
        };

        // Handling Input Perintah
        terminalInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                const inputVal = this.value.trim().toLowerCase();
                this.value = '';

                if (!inputVal) return;

                // Tampilkan perintah pengguna di terminal
                const userLine = document.createElement('div');
                userLine.className = 'flex items-center gap-2 mt-2';
                userLine.innerHTML = `<span class="text-emerald-400 font-bold">visitor@rzr:~$</span> <span>${inputVal}</span>`;
                terminalBody.appendChild(userLine);

                // Eksekusi perintah
                const responseLine = document.createElement('div');
                responseLine.className = 'text-slate-300 ml-2 mb-2';

                if (inputVal === 'clear') {
                    terminalBody.innerHTML = `
                        <p class="text-blue-400">Welcome to RZR Developer Terminal!</p>
                        <p class="text-slate-400">Type <span class="text-emerald-400">'help'</span> to see available commands.</p>
                    `;
                    return;
                } else if (commands[inputVal]) {
                    responseLine.innerHTML = commands[inputVal];
                } else {
                    responseLine.innerHTML = `<span class="text-red-400">Command not recognized: '${inputVal}'. Type <span class="text-emerald-400">'help'</span> for assistance.</span>`;
                }

                terminalBody.appendChild(responseLine);
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }
        });
    </script>
</body>
</html>
